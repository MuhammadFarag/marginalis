# Release: tag v* -> build the zip and attach it to a GitHub Release.
# (JetBrains Marketplace publishing can hang off this later with a
# PUBLISH_TOKEN secret and `./gradlew publishPlugin`.)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew buildPlugin --console=plain
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
