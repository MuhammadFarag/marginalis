<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- margin/gutter rule (lightened for dark surfaces) -->
  <rect x="4" y="4" width="3.5" height="32" rx="1.75" fill="#9D4EDD"/>
  <!-- code lines -->
  <g fill="#8A8D93">
    <rect x="12" y="7" width="14" height="3" rx="1.5"/>
    <rect x="12" y="13" width="21" height="3" rx="1.5"/>
    <rect x="12" y="24" width="17" height="3" rx="1.5"/>
    <rect x="12" y="30" width="20" height="3" rx="1.5"/>
  </g>
  <!-- human bubble (blue, behind right) -->
  <g fill="#1E88E5">
    <rect x="22" y="17" width="13" height="9.5" rx="4.75"/>
    <polygon points="29.5,25 34,25 32,29.5"/>
  </g>
  <!-- agent bubble (violet, front left) -->
  <g fill="#AB47BC">
    <rect x="10" y="13" width="15" height="10.5" rx="5.25"/>
    <polygon points="13,22.5 18.5,22.5 14,27.5"/>
  </g>
</svg>
