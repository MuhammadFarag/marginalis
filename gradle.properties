# Tenant sandbox blocks undeclared loopback ports; the daemon uses a random one.
# (Also set globally in ~/.gradle/gradle.properties — kept here so the project
# is safe to build anywhere.)
org.gradle.daemon=false

# Even with the daemon off, Gradle forks a single-use daemon (over a blocked
# loopback port) unless the client JVM passes DaemonCompatibilitySpec: its
# immutable input args must EXACTLY equal these jvmargs + the locale props
# Gradle auto-appends, and instrumentation-agent status must match. See
# GRADLE_OPTS in ~/.zshrc.local, which mirrors this line and adds
# -Duser.country/-Duser.language/-Duser.variant and
# -Dorg.gradle.internal.instrumentation.agent=false.
# (-Xms is needed on both sides because gradlew injects a default -Xms64m.)
org.gradle.jvmargs=-Xms256m -Xmx2g -Dfile.encoding=UTF-8

# The IntelliJ Platform bundles the Kotlin stdlib; don't ship our own.
kotlin.stdlib.default.dependency=false

# The Kotlin compile daemon talks over random loopback ports, which the
# sandbox blocks — compile in the Gradle process instead.
kotlin.compiler.execution.strategy=in-process
